<!doctype html><html lang="id"><head><script>document.documentElement.dataset.theme=localStorage.getItem("naikin_theme")==="dark"?"dark":"light";</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usulan Katalog · Naikin</title><link rel="stylesheet" href="css/app.css"><style>body{display:block;padding:28px;max-width:1180px;margin:auto}.draftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.draft{padding:18px;border:1px solid #bbb5;border-radius:18px;background:var(--card,#fff)}.draft p{font-size:13px;line-height:1.6}.draft strong{font-size:20px}.pillx{font-size:12px;border-radius:12px;background:#d7f36b;color:#302a39;padding:5px 9px}header{position:static!important;background:transparent!important;padding:0!important}input{max-width:500px}</style></head><body><header><div><a href="index.html">← Naikin</a><h1>Usulan katalog tambahan</h1><p>Harga usulan untuk ditinjau admin. Belum dapat dipesan sampai diverifikasi dan diaktifkan.</p></div></header><input id="filter" placeholder="Cari layanan atau kategori" aria-label="Cari layanan"><p id="count"></p><div id="grid" class="draftgrid"></div><script>fetch('assets/catalog-additions.json').then(r=>r.json()).then(items=>{const el=document.querySelector('#grid'),f=document.querySelector('#filter');function render(){let q=f.value.toLowerCase(),arr=items.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q));document.querySelector('#count').textContent=arr.length+' produk tambahan';el.replaceChildren(...arr.map(x=>{let d=document.createElement('article');d.className='draft';let tag=document.createElement('span');tag.className='pillx';tag.textContent=x.category;let h=document.createElement('h3');h.textContent=x.name;let p=document.createElement('p');p.textContent=x.description;let b=document.createElement('strong');b.textContent='Rp'+(x.price_per_unit*1000).toLocaleString('id-ID')+' / 1.000';let r=document.createElement('p');r.textContent='Syarat: '+x.requirements;d.append(tag,h,p,b,r);return d}))}f.oninput=render;render()}).catch(()=>document.querySelector('#count').textContent='Katalog belum bisa dimuat. Jalankan lewat localhost.');</script></body></html>
