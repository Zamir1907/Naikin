<script>
const faqData = [
  {q:"Bagaimana cara order?", a:"Daftar (bonus Rp5.000), deposit minimal Rp10.000, pilih layanan di halaman Layanan, atur quantity, isi target, konfirmasi."},
  {q:"Kenapa harus deposit dulu?", a:"Bonus daftar belum bisa dipakai order. Deposit sekali (minimal Rp10.000) membuka akses order penuh."},
  {q:"Bisa atur jumlah sendiri?", a:"Ya. Untuk followers, likes, views, members, dll. kamu bisa set quantity sendiri (min–max per produk)."},
  {q:"Berapa lama proses?", a:"Rata-rata di bawah 5 menit. Status bisa dipantau di Riwayat Order."},
  {q:"Perlu password akun?", a:"Tidak. Cukup username atau link target saja."},
  {q:"Bagaimana cara deposit?", a:"Buka halaman Deposit, pilih nominal (min Rp10.000), bayar via QRIS, lalu konfirmasi di Akun → Riwayat Deposit."},
  {q:"Apakah data tersimpan setelah refresh?", a:"Ya, selama kamu login data saldo, order, dan transaksi tersimpan di browser kamu."}
];
function renderFaq(){
  const list = document.getElementById("faqList");
  list.innerHTML = faqData.map(f=>`<div class="faq-item"><button class="faq-q">${f.q}<i data-lucide="chevron-down" class="chev" style="width:16px;height:16px"></i></button><div class="faq-a"><p>${f.a}</p></div></div>`).join("");
  if(window.lucide) lucide.createIcons();
  list.querySelectorAll(".faq-item").forEach(item=>{
    item.querySelector(".faq-q").addEventListener("click",()=>{
      const open = item.classList.contains("open");
      list.querySelectorAll(".faq-item").forEach(i=>i.classList.remove("open"));
      if(!open) item.classList.add("open");
    });
  });
}
function renderAll(){ renderSidebarUser(); renderFaq(); }
function initApp(){ initCommon(); renderAll(); }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", initApp); else initApp();
window.addEventListener("load", ()=>{ if(window.lucide) lucide.createIcons(); });
</script>
